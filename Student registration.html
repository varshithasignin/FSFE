<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            background-color: rgb(8, 8, 8);
            font-family: caligraphy;
        }

        .login-box {
            background-color: rgb(32, 220, 29);
            width: 300px;
            padding: 25px;
            margin: 100px auto;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: rgb(67, 67, 164);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: 1px solid rgb(76, 95, 194);
            border-radius: 5px;
        }

        button {
            background-color: rgb(250, 250, 250);
            color: rgb(20, 8, 15);
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(203, 134, 134);
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Student Registration</h2>

        <form>
            <input type="text"
                   placeholder="Enter Username">
            <input type="Roll number"
                   placeholder="Enter Roll Number">
            <input type="password"
                   placeholder="Enter Password">
            <input type="Phone Number"
                   placeholder="Enter Phone Number">
            <input type="text"
                   placeholder="Enter your Gender">
            <input type="Email"
                   placeholder="Enter email ID">
            <input type="DOB"
                   placeholder="Enter your DOB">
            <button type="submit">Register</button>
            <button type="reset">Clear</button>
            <br><br>
        </form>

    </div>

</body>
</html>
